name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run setup
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 tests/test_failures.py
      - run: python3 tests/test_bootstrap.py
      - run: npm run test:dependencies
      - run: ./bin/titian init --origin https://ci.example.test
      - run: ./bin/titian runtime install
      - run: npm audit --audit-level=moderate
